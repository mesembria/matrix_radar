# Flight radar on a 64x32 HUB75 panel driven by an Adafruit Matrix Portal S3.
# Put flight_radar.h next to this file in your ESPHome config folder.

substitutions:
  name: flight-radar
  friendly_name: Flight Radar

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - flight_radar.h

esp32:
  board: adafruit_matrixportal_esp32s3
  framework:
    type: esp-idf   # the hub75 display needs ESP-IDF

psram:
  mode: quad        # the Matrix Portal S3 has 2 MB of quad PSRAM

logger:

api:
  # The ESPHome dashboard can generate a key for you; paste it in secrets.yaml.
  encryption:
    key: !secret flight_radar_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}            # fallback hotspot if Wi-Fi fails

captive_portal:

# ---------- Data from Home Assistant ----------
text_sensor:
  - platform: homeassistant
    id: packed
    entity_id: sensor.flight_radar_planes
    attribute: packed
    internal: true
    on_value:
      - lambda: fr::parse(x);

# ---------- Settings (also show up in Home Assistant) ----------
number:
  - platform: template
    id: range_mi
    name: Radar range
    icon: mdi:radar
    unit_of_measurement: mi
    min_value: 5
    max_value: 20
    step: 5
    initial_value: 10
    optimistic: true
    restore_value: true

  - platform: template
    id: ring_mi
    name: Inner ring
    icon: mdi:circle-outline
    unit_of_measurement: mi
    min_value: 0.5
    max_value: 3
    step: 0.5
    initial_value: 2
    optimistic: true
    restore_value: true

  - platform: template
    id: bright_num
    name: Brightness
    icon: mdi:brightness-6
    min_value: 5
    max_value: 255
    step: 1
    initial_value: 128
    optimistic: true
    restore_value: true
    on_value:
      - hub75.set_brightness:
          id: matrix
          brightness: !lambda 'return (uint8_t) x;'

# ---------- Buttons on the board's edge ----------
# Radar:   tap Up = zoom out, tap Down = zoom in; hold Up/Down = bigger/smaller inner ring
# Details: tap Up = previous plane, tap Down = next; hold either = radar only for 2 minutes
binary_sensor:
  - platform: gpio
    id: btn_up
    internal: true
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true   # the board has no pull-up resistors on these buttons
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_click:
      - min_length: 20ms
        max_length: 600ms
        then:
          - lambda: fr::on_tap(+1, id(range_mi), id(ring_mi));
      - min_length: 700ms
        max_length: 5s
        then:
          - lambda: fr::on_hold(+1, id(range_mi), id(ring_mi));

  - platform: gpio
    id: btn_down
    internal: true
    pin:
      number: GPIO7
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_click:
      - min_length: 20ms
        max_length: 600ms
        then:
          - lambda: fr::on_tap(-1, id(range_mi), id(ring_mi));
      - min_length: 700ms
        max_length: 5s
        then:
          - lambda: fr::on_hold(-1, id(range_mi), id(ring_mi));

# ---------- The panel ----------
display:
  - platform: hub75
    id: matrix
    board: adafruit-matrix-portal-s3
    panel_width: 64
    panel_height: 32
    brightness: 128
    double_buffer: true   # no flicker while a frame is drawn
    update_interval: 66ms # about 15 frames a second for the sweep
    lambda: |-
      fr::render(it, id(range_mi).state, id(ring_mi).state);
